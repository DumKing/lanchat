name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "main"
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build external desktop pet packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets\desktop-pets | Out-Null
          foreach ($pet in @("violet-tail-girl", "white-fox-tech")) {
            $source = Join-Path "desktop-pet-packages" $pet
            if (Test-Path -LiteralPath $source) {
              $target = Join-Path "release-assets\desktop-pets" "$pet.zip"
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
              Compress-Archive -Path $source -DestinationPath $target -Force
            }
          }

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Build Windows portable package
        shell: pwsh
        run: |
          $portableRoot = "release-assets\portable\lanchat-windows-portable"
          if (Test-Path -LiteralPath $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          Copy-Item -LiteralPath "src-tauri\target\release\lanchat.exe" -Destination $portableRoot
          if (Test-Path -LiteralPath "src-tauri\target\release\resources") {
            Copy-Item -LiteralPath "src-tauri\target\release\resources" -Destination $portableRoot -Recurse
          }
          @"
          LanChat Windows 绿色版

          1. 解压后直接运行 lanchat.exe。
          2. 默认内置 frog-buddy 桌宠。
          3. 如系统缺少 WebView2 Runtime，请先安装 Microsoft Edge WebView2 Runtime。
          "@ | Set-Content -Encoding UTF8 (Join-Path $portableRoot "README.txt")
          Compress-Archive -Path "$portableRoot\*" -DestinationPath "release-assets\portable\lanchat-windows-portable.zip" -Force

      - name: Build Windows Lite installer
        run: npm run tauri:build:lite -- --bundles nsis

      - name: Build Windows Lite portable package
        shell: pwsh
        run: |
          $portableRoot = "release-assets\portable\lanchat-lite-windows-portable"
          if (Test-Path -LiteralPath $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          Copy-Item -LiteralPath "src-tauri\target\release\lanchat-lite.exe" -Destination $portableRoot
          if (Test-Path -LiteralPath "src-tauri\target\release\resources") {
            Copy-Item -LiteralPath "src-tauri\target\release\resources" -Destination $portableRoot -Recurse
          }
          @"
          LanChat Lite Windows 绿色版

          1. 解压后直接运行 lanchat-lite.exe。
          2. Lite 仅包含桌宠告警器、狼来了排行榜、桌宠设置和外部推送配置。
          3. 默认内置 frog-buddy 桌宠。
          4. 如系统缺少 WebView2 Runtime，请先安装 Microsoft Edge WebView2 Runtime。
          "@ | Set-Content -Encoding UTF8 (Join-Path $portableRoot "README.txt")
          Compress-Archive -Path "$portableRoot\*" -DestinationPath "release-assets\portable\lanchat-lite-windows-portable.zip" -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            release-assets/portable/*.zip
            release-assets/desktop-pets/*.zip
