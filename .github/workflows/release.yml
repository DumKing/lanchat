name: Release Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
      force_update:
        description: "Mark this release as mandatory for older clients"
        required: false
        default: false
        type: boolean
      min_supported_version:
        description: "Minimum supported version shown in update metadata"
        required: false
        default: "0.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: lanchat-windows
          - os: macos-15
            bundle: app,dmg
            artifact: lanchat-macos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build external desktop pet packages
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets/desktop-pets | Out-Null
          foreach ($pet in @("violet-tail-girl", "white-fox-tech")) {
            $source = Join-Path "desktop-pet-packages" $pet
            if (Test-Path -LiteralPath $source) {
              $target = Join-Path "release-assets/desktop-pets" "$pet.zip"
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
              Compress-Archive -Path $source -DestinationPath $target -Force
            }
          }

      - name: Build Tauri bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Preserve Full bundle assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets/bundles/full | Out-Null
          if (Test-Path -LiteralPath "src-tauri/target/release/bundle/nsis") {
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination "release-assets/bundles/full" -Force
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.sig" -Destination "release-assets/bundles/full" -Force -ErrorAction SilentlyContinue
          }
          if (Test-Path -LiteralPath "src-tauri/target/release/bundle/dmg") {
            Copy-Item -Path "src-tauri/target/release/bundle/dmg/*.dmg" -Destination "release-assets/bundles/full" -Force
          }
          if (Test-Path -LiteralPath "src-tauri/target/release/bundle/macos") {
            Copy-Item -Path "src-tauri/target/release/bundle/macos/*.tar.gz" -Destination "release-assets/bundles/full" -Force -ErrorAction SilentlyContinue
            Copy-Item -Path "src-tauri/target/release/bundle/macos/*.sig" -Destination "release-assets/bundles/full" -Force -ErrorAction SilentlyContinue
          }

      - name: Build Windows portable package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $portableRoot = "release-assets/portable/lanchat-windows-portable"
          if (Test-Path -LiteralPath $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/lanchat.exe" -Destination $portableRoot
          if (Test-Path -LiteralPath "src-tauri/target/release/resources") {
            Copy-Item -LiteralPath "src-tauri/target/release/resources" -Destination $portableRoot -Recurse
          }
          @"
          LanChat Windows 绿色版

          1. 解压后直接运行 lanchat.exe。
          2. 默认内置 frog-hood-girl 桌宠，仍可在设置中切换 frog-buddy。
          3. 如系统缺少 WebView2 Runtime，请先安装 Microsoft Edge WebView2 Runtime。
          "@ | Set-Content -Encoding UTF8 (Join-Path $portableRoot "README.txt")
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "release-assets/portable/lanchat-windows-portable.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release-assets/bundles/**/*.exe
            release-assets/bundles/**/*.sig
            release-assets/bundles/**/*.dmg
            release-assets/portable/*.zip
            release-assets/desktop-pets/*.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Create update metadata
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          FORCE_UPDATE="${{ github.event_name == 'workflow_dispatch' && inputs.force_update || 'false' }}"
          MIN_SUPPORTED_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.min_supported_version || '0.0.0' }}"
          PORTABLE=$(find release-downloads -iname 'lanchat-windows-portable.zip' | head -n 1)
          INSTALLER=$(find release-downloads -iname '*.exe' | head -n 1)
          SIGNATURE=$(find release-downloads -iname '*.exe.sig' | head -n 1)
          if [ -z "${PORTABLE}" ] || [ -z "${INSTALLER}" ] || [ -z "${SIGNATURE}" ]; then
            echo "缺少绿色包或签名后的 Windows 更新包，请确认 TAURI_SIGNING_PRIVATE_KEY Secret 已配置。"
            exit 1
          fi
          PORTABLE_SHA256=$(sha256sum "${PORTABLE}" | awk '{print $1}')
          cat > release-downloads/lanchat-update.json <<EOF
          {
            "version": "${VERSION}",
            "force": ${FORCE_UPDATE},
            "min_supported_version": "${MIN_SUPPORTED_VERSION}",
            "title": "LanChat ${TAG}",
            "notes": "发现新版本后会弹出更新提醒；标记为强制更新的版本必须安装后才能继续使用。",
            "downloads": {
              "windows_portable": "https://github.com/${{ github.repository }}/releases/download/${TAG}/lanchat-windows-portable.zip",
              "windows_portable_sha256": "${PORTABLE_SHA256}",
              "windows_installer": "https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "${INSTALLER}")",
              "release_page": "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            }
          }
          EOF

          cat > release-downloads/latest.json <<EOF
          {
            "version": "${VERSION}",
            "notes": "LanChat ${TAG}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$(cat "${SIGNATURE}")",
                "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/$(basename "${INSTALLER}")"
              }
            }
          }
          EOF

      - name: Generate release checksums
        shell: bash
        run: |
          find release-downloads -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.dmg' \) -print0 | sort -z | xargs -0 sha256sum > release-downloads/SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: LanChat ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-downloads/**/*


      - name: Notify WeCom group
        if: ${{ vars.WECHAT_RELEASE_NOTIFY_ENABLED == 'true' }}
        shell: bash
        env:
          WECHAT_RELEASE_BOT_WEBHOOK: ${{ secrets.WECHAT_RELEASE_BOT_WEBHOOK }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${WECHAT_RELEASE_BOT_WEBHOOK}" ]; then
            echo "WECHAT_RELEASE_NOTIFY_ENABLED 已开启，但未配置 WECHAT_RELEASE_BOT_WEBHOOK Secret。"
            exit 1
          fi

          RELEASE_NOTES_PATH="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "${RELEASE_NOTES_PATH}" ]; then
            echo "未找到本次发布说明：${RELEASE_NOTES_PATH}"
            exit 1
          fi
          RELEASE_NOTES=$(cat "${RELEASE_NOTES_PATH}")
          MARKDOWN_CONTENT=$(cat <<EOF
          ## LanChat 新版本已发布
          > **版本：** <font color="info">${RELEASE_TAG}</font>
          > **仓库：** ${REPOSITORY}

          ${RELEASE_NOTES}

          [查看 Release 与下载附件](${RELEASE_URL})
          EOF
          )
          PAYLOAD=$(jq -n --arg content "${MARKDOWN_CONTENT}" '{msgtype: "markdown", markdown: {content: $content}}')
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${WECHAT_RELEASE_BOT_WEBHOOK}")
          echo "${RESPONSE}"
          test "$(echo "${RESPONSE}" | jq -r '.errcode')" = "0"
