name: Release Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: lanchat-windows
          - os: macos-15
            bundle: app,dmg
            artifact: lanchat-macos

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build external desktop pet packages
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets/desktop-pets | Out-Null
          foreach ($pet in @("violet-tail-girl", "white-fox-tech")) {
            $source = Join-Path "desktop-pet-packages" $pet
            if (Test-Path -LiteralPath $source) {
              $target = Join-Path "release-assets/desktop-pets" "$pet.zip"
              if (Test-Path -LiteralPath $target) { Remove-Item -LiteralPath $target -Force }
              Compress-Archive -Path $source -DestinationPath $target -Force
            }
          }

      - name: Build Tauri bundle
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - name: Preserve Full bundle assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets/bundles/full | Out-Null
          if (Test-Path -LiteralPath "src-tauri/target/release/bundle/nsis") {
            Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination "release-assets/bundles/full" -Force
          }
          if (Test-Path -LiteralPath "src-tauri/target/release/bundle/dmg") {
            Copy-Item -Path "src-tauri/target/release/bundle/dmg/*.dmg" -Destination "release-assets/bundles/full" -Force
          }

      - name: Build Windows portable package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $portableRoot = "release-assets/portable/lanchat-windows-portable"
          if (Test-Path -LiteralPath $portableRoot) { Remove-Item -LiteralPath $portableRoot -Recurse -Force }
          New-Item -ItemType Directory -Force $portableRoot | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/release/lanchat.exe" -Destination $portableRoot
          if (Test-Path -LiteralPath "src-tauri/target/release/resources") {
            Copy-Item -LiteralPath "src-tauri/target/release/resources" -Destination $portableRoot -Recurse
          }
          @"
          LanChat Windows 绿色版

          1. 解压后直接运行 lanchat.exe。
          2. 默认内置 frog-buddy 桌宠。
          3. 如系统缺少 WebView2 Runtime，请先安装 Microsoft Edge WebView2 Runtime。
          "@ | Set-Content -Encoding UTF8 (Join-Path $portableRoot "README.txt")
          Compress-Archive -Path "$portableRoot/*" -DestinationPath "release-assets/portable/lanchat-windows-portable.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release-assets/bundles/**/*.exe
            release-assets/bundles/**/*.dmg
            release-assets/portable/*.zip
            release-assets/desktop-pets/*.zip

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads

      - name: Create update metadata
        shell: bash
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cat > release-downloads/lanchat-update.json <<EOF
          {
            "version": "${VERSION}",
            "force": false,
            "min_supported_version": "0.0.0",
            "title": "LanChat ${TAG}",
            "notes": "发现新版本后会弹出更新提醒，用户可以关闭提醒后继续使用。",
            "downloads": {
              "windows_portable": "https://github.com/${{ github.repository }}/releases/download/${TAG}/lanchat-windows-portable.zip",
              "release_page": "https://github.com/${{ github.repository }}/releases/tag/${TAG}"
            }
          }
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: LanChat ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          body_path: docs/releases/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.md
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-downloads/**/*


      - name: Notify WeCom group
        if: ${{ vars.WECHAT_RELEASE_NOTIFY_ENABLED == 'true' }}
        shell: bash
        env:
          WECHAT_RELEASE_BOT_WEBHOOK: ${{ secrets.WECHAT_RELEASE_BOT_WEBHOOK }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "${WECHAT_RELEASE_BOT_WEBHOOK}" ]; then
            echo "WECHAT_RELEASE_NOTIFY_ENABLED 已开启，但未配置 WECHAT_RELEASE_BOT_WEBHOOK Secret。"
            exit 1
          fi

          MARKDOWN_CONTENT=$(cat <<EOF
          ## LanChat 新版本已发布
          > **版本：** <font color="info">${RELEASE_TAG}</font>
          > **仓库：** ${REPOSITORY}
          > **构建产物：** Windows 安装包、Windows 绿色版、macOS 安装包

          [查看 Release 与下载附件](${RELEASE_URL})
          EOF
          )
          PAYLOAD=$(jq -n --arg content "${MARKDOWN_CONTENT}" '{msgtype: "markdown", markdown: {content: $content}}')
          RESPONSE=$(curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${WECHAT_RELEASE_BOT_WEBHOOK}")
          echo "${RESPONSE}"
          test "$(echo "${RESPONSE}" | jq -r '.errcode')" = "0"
