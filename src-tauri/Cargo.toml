[package]
name = "lanchat"
version = "0.5.1"
description = "A serverless LAN chat desktop app"
authors = ["LanChat"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
uuid = { version = "1.23.4", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
mdns-sd = "0.20.1"
mac_address = "1.1.8"
sha2 = "0.11.0"
hex = "0.4.3"
if-addrs = "0.15.0"
eframe = "0.28"
winit = "0.29.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
fastrand = "2.4.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
fs2 = "0.4.3"
md5 = "0.8.0"
tauri-plugin-updater = "2.10.1"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "tls-rustls"] }
ndarray = "0.17.2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[dev-dependencies]
tempfile = "3.27.0"
